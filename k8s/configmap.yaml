apiVersion: v1
kind: ConfigMap
metadata:
  name: training-config
  namespace: ml-training
data:
  training_config.yaml: |
    dataset:
      name: CIFAR10
      train_subset: 5000
      val_subset: 1000
      data_dir: /app/data

    model:
      name: resnet18
      num_classes: 10
      pretrained: true

    training:
      batch_size: 128
      learning_rate: 0.001
      epochs: 5
      early_stopping_patience: 2
      num_workers: 0

    output:
      checkpoint_dir: /app/checkpoints
      metrics_file: /app/outputs/metrics.jsonl
      model_name: classifier_v1.pt
