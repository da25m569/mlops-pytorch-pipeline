dataset:
  name: CIFAR10
  train_subset: 5000
  val_subset: 1000
  data_dir: ./data

model:
  name: resnet18
  num_classes: 10
  pretrained: true

training:
  batch_size: 128
  learning_rate: 0.001
  epochs: 5
  early_stopping_patience: 2
  num_workers: 2

output:
  checkpoint_dir: ./checkpoints
  metrics_file: ./outputs/metrics.jsonl
